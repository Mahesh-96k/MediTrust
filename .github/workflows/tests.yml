
name: MediTrust Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ocr-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: module1_document_intelligence

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: module1_document_intelligence/requirements.txt

      - name: Install OCR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Run OCR tests
        run: python -m pytest tests -q

  fraud-engine-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/fraud_engine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Fraud Engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Fraud Engine tests
        run: python -m pytest test_fraud_engine.py test_api_pytest.py -q
